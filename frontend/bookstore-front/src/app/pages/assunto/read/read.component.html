<div class="container main-container">
    <ngx-spinner bdColor="rgba(0, 0, 0, 0.8)" size="medium" color="#fff" type="ball-scale-multiple" [fullScreen]="true">
        <p style="color: white"> Carregando... </p>
    </ngx-spinner>    
    <h1>Assuntos</h1>
    <p>
        <a class="btn btn-success" [routerLink]="['/assunto/create']">Novo Registro</a>
    </p>
    <table class="table table-striped table-hover">
        <thead class="table-dark">
            <tr>
                <th scope="col">Codigo</th>
                <th scope="col">Nome</th>
                <th scope="col"></th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let assunto of assuntos">
                <th scope="row">
                    {{ assunto.id }}
                </th>
                <td>
                    {{ assunto.descricao }}
                </td>
                <td class="text-end">
                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                        <a class="btn btn-warning text-white" [routerLink]="['/assunto/update', assunto.id]">
                            <span class="fa fa-pencil-alt"></span>
                        </a>
                        <a class="btn btn-danger text-white" [routerLink]="['/assunto/delete', assunto.id]">
                            <span class="fa fa-trash"></span>
                        </a>
                    </div>
                </td>
            </tr>
        </tbody>
    </table>
</div>
